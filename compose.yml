services:
  checkip:
    container_name: checkip
    restart: unless-stopped
    build: .
    user: "10001"
    networks:
      - caddy
    # ports:
    #   - "8133:8133"
    healthcheck:
      test: [ "CMD", "/healthcheck", "http://localhost:8133/ping" ]
      interval: 60s
      timeout: 15s
      retries: 3

networks:
  caddy:
    external: true
